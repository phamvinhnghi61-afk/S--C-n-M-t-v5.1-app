name: Build APK So Can Mit Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai dat Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dong goi Capacitor Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "So Can Mit Pro" "vn.io.linhkienpinthapmuoi.socanmitpro" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Gan Logo Huy Hieu Tron
        run: |
          if [ -f icon.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*; do
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
            done
          fi

      - name: Bien dich file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Xuat file APK
        uses: actions/upload-artifact@v4
        with:
          name: So-Can-Mit-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
